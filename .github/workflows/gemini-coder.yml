name: Gemini AI Assistant

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What should I do, Sire?'
        required: true
        type: string
      files:
        description: 'Write files with a space (e.g. deploy-static.yml WorkspaceModals.tsx )'
        required: false
        type: string

jobs:
  gemini-edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Configure Git
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "gemini-bot@users.noreply.github.com"

      - name: Run Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_PROMPT: ${{ inputs.prompt }}
          TARGET_FILES: ${{ inputs.files }}
        run: |
          if [ -n "$TARGET_FILES" ]; then
            aider --model gemini/gemini-1.5-flash --yes-always --message "$USER_PROMPT" $TARGET_FILES
          else
            aider --model gemini/gemini-1.5-flash --yes-always --message "$USER_PROMPT"
          fi

      - name: Push changes
        run: |
          git push origin ${{ github.ref_name }}