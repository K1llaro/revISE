name: Deploy Astro to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install Astro dependencies
        run: npm ci

      - name: Build Astro site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: revise-api
          IMAGE_TAG: ${{ github.sha }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY || aws ecr create-repository --repository-name $ECR_REPOSITORY
          
          # Передаем ключи Supabase внутрь docker build через --build-arg
          docker build \
            --build-arg PUBLIC_SUPABASE_URL="$PUBLIC_SUPABASE_URL" \
            --build-arg PUBLIC_SUPABASE_ANON_KEY="$PUBLIC_SUPABASE_ANON_KEY" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
            
          docker push -a $ECR_REGISTRY/$ECR_REPOSITORY
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Install CDK dependencies
        run: cd cdk && npm ci

      - name: Bootstrap CDK
        run: cd cdk && npx cdk bootstrap

      - name: Deploy CDK infrastructure to AWS
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          TURSO_SECRET_ARN: ${{ secrets.TURSO_SECRET_ARN }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          # Передаем тег образа в CDK!
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: cd cdk && npx cdk deploy --require-approval never