name: Deploy Astro to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ПЕРЕНОСИМ ПЕРЕМЕННЫЕ СЮДА: теперь они доступны на КАЖДОМ шаге (включая cdk bootstrap)
    env:
      SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      TURSO_SECRET_ARN: ${{ secrets.TURSO_SECRET_ARN }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install Astro dependencies
        run: npm ci

      - name: Build Astro site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Образ API для Lambda
          aws ecr describe-repositories --repository-names revise-api || aws ecr create-repository --repository-name revise-api
          docker build \
            --build-arg PUBLIC_SUPABASE_URL="${{ secrets.PUBLIC_SUPABASE_URL }}" \
            --build-arg PUBLIC_SUPABASE_ANON_KEY="${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            -t $ECR_REGISTRY/revise-api:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/revise-api:latest .
          docker push -a $ECR_REGISTRY/revise-api

          # 2. Образ Astro для Load Balancer (Lab 6: astro-blog)
          aws ecr describe-repositories --repository-names astro-blog || aws ecr create-repository --repository-name astro-blog
          docker build \
            -f Dockerfile.astro \
            --build-arg PUBLIC_SUPABASE_URL="${{ secrets.PUBLIC_SUPABASE_URL }}" \
            --build-arg PUBLIC_SUPABASE_ANON_KEY="${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            -t $ECR_REGISTRY/astro-blog:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/astro-blog:latest .
          docker push -a $ECR_REGISTRY/astro-blog

      - name: Install CDK dependencies
        run: cd cdk && npm ci

      - name: Bootstrap CDK
        run: cd cdk && npx cdk bootstrap

      - name: Deploy CDK infrastructure to AWS
        run: cd cdk && npx cdk deploy --all --require-approval never